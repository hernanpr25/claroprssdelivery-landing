<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claro PR SS Delivery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a0a0a;
            color: #fff;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(218, 17, 30, 0.12) 0%, transparent 50%),
                        radial-gradient(circle at 70% 60%, rgba(218, 17, 30, 0.08) 0%, transparent 40%);
            pointer-events: none;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 520px;
            position: relative;
            z-index: 1;
        }
        .logo {
            width: 180px;
            margin-bottom: 2.5rem;
            filter: drop-shadow(0 0 30px rgba(218, 17, 30, 0.3));
        }
        .line-top {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #da111e, transparent);
            margin: 0 auto 2rem;
            border-radius: 2px;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 0%, #f0c4c7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        p {
            font-size: 1.05rem;
            color: #a09090;
            line-height: 1.7;
            margin-bottom: 0.3rem;
        }
        .divider {
            width: 40px;
            height: 2px;
            background: #da111e;
            margin: 1.8rem auto;
            border-radius: 2px;
            box-shadow: 0 0 12px rgba(218, 17, 30, 0.4);
        }
        .contact {
            font-size: 0.9rem;
            color: #706060;
        }
        .contact a {
            color: #da111e;
            text-decoration: none;
            transition: color 0.2s;
        }
        .contact a:hover { color: #ff3040; }
        .contact .sep {
            margin: 0 0.6rem;
            color: #403535;
        }
        .footer {
            position: absolute;
            bottom: 2rem;
            font-size: 0.75rem;
            color: #403535;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 1;
        }
        .pulse-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 1px solid rgba(218, 17, 30, 0.06);
            animation: ring-pulse 4s ease-in-out infinite;
            pointer-events: none;
        }
        .pulse-ring:nth-child(2) { width: 500px; height: 500px; animation-delay: 1s; }
        .pulse-ring:nth-child(3) { width: 700px; height: 700px; animation-delay: 2s; }
        @keyframes ring-pulse {
            0%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>

    <div class="container">
        <svg class="logo" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
            <rect x="0" y="15" width="8" height="30" rx="2" fill="#da111e"/>
            <rect x="12" y="8" width="8" height="44" rx="2" fill="#da111e"/>
            <rect x="24" y="18" width="8" height="24" rx="2" fill="#da111e"/>
            <rect x="36" y="5" width="8" height="50" rx="2" fill="#da111e"/>
            <rect x="48" y="22" width="8" height="16" rx="2" fill="#da111e"/>
            <text x="68" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="700" fill="#ffffff">SS</text>
            <text x="107" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="300" fill="#da111e">Delivery</text>
        </svg>

        <div class="line-top"></div>

        <h1>Estamos trabajando en algo nuevo</h1>
        <p>Nuestro sitio web esta siendo actualizado.</p>
        <p>Pronto estaremos de vuelta.</p>

        <div class="divider"></div>

        <div class="contact">
            <p>Mientras tanto, contactanos</p>
            <a href="mailto:admin@claroprssdelivery.com">admin@claroprssdelivery.com</a>
            <span class="sep">&bull;</span>
            <a href="https://wa.me/17877962099">WhatsApp 787-796-2099</a>
        </div>
    </div>

    <div class="footer">Claro PR &bull; SS Delivery</div>
</body>
</html>
